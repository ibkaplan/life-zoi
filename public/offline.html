<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6A3DA8">
<title>lifeZoi · Offline</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { --bg: #F9F7F2; --surface: #ffffff; --ink: #172554; --muted: #2E3A66; --heading: #4A2380; --primary: #6A3DA8; --line: #DDD4F2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif; font-size: 1.125rem; line-height: 1.55; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }
  main { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 28px rgba(23, 37, 84, 0.06); max-width: 30rem; width: 100%; padding: 28px 24px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-family: Georgia, "Noto Serif", serif; color: var(--heading); font-size: 1.75rem; line-height: 1.2; margin: 16px 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--primary); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 id="t">You are offline</h1>
  <p id="b">lifeZoi needs an internet connection to open your pages. Nothing you saved is lost.</p>
  <p id="h">Check your Wi-Fi or mobile data, then try again.</p>
  <button id="r" type="button">Try again</button>
</main>
<script>
(function () {
  var text = {
    en: ["You are offline", "lifeZoi needs an internet connection to open your pages. Nothing you saved is lost.", "Check your Wi-Fi or mobile data, then try again.", "Try again", "Offline"],
    uk: ["Немає з’єднання з інтернетом", "Щоб відкрити ваші сторінки, lifeZoi потрібен інтернет. Усе, що ви зберегли, нікуди не зникло.", "Перевірте Wi-Fi або мобільний інтернет і спробуйте ще раз.", "Спробувати ще раз", "Немає з’єднання"],
    ru: ["Нет подключения к интернету", "Чтобы открыть ваши страницы, lifeZoi нужен интернет. Всё, что вы сохранили, на месте.", "Проверьте Wi-Fi или мобильный интернет и попробуйте ещё раз.", "Попробовать ещё раз", "Нет подключения"],
    el: ["Δεν υπάρχει σύνδεση", "Το lifeZoi χρειάζεται σύνδεση στο διαδίκτυο για να ανοίξει τις σελίδες σας. Ό,τι έχετε αποθηκεύσει δεν χάνεται.", "Ελέγξτε το Wi-Fi ή τα δεδομένα κινητής και δοκιμάστε ξανά.", "Δοκιμάστε ξανά", "Εκτός σύνδεσης"]
  };
  var lang = "en";
  try {
    var saved = localStorage.getItem("lifezoi.locale.v1");
    if (text[saved]) lang = saved;
    else {
      var list = navigator.languages || [navigator.language || ""];
      for (var i = 0; i < list.length; i++) {
        var base = String(list[i]).toLowerCase().split(/[-_]/)[0];
        if (text[base]) { lang = base; break; }
      }
    }
  } catch (e) {}
  var t = text[lang];
  document.documentElement.lang = lang;
  document.title = "lifeZoi · " + t[4];
  document.getElementById("t").textContent = t[0];
  document.getElementById("b").textContent = t[1];
  document.getElementById("h").textContent = t[2];
  document.getElementById("r").textContent = t[3];
  document.getElementById("r").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });
})();
</script>
</body>
</html>
